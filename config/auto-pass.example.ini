# Repo-local auto-pass defaults for snowbridge.
# Copy to config/auto-pass.ini to keep these overrides out of git.

[auto_pass]
profile = your-profile

[filebrowser]
admin_password_keepass_entry = filebrowser/example-admin
snowbridge_password_keepass_entry = filebrowser/example-user

# Entry holding the rclone config encryption password, read by
# scripts/rclone_config_password.py. That password protects the encrypted
# rclone config, which is what keeps OAuth refresh tokens and the iCloud
# app-specific password unreadable at rest. It is not a provider credential.
# rclone_config_keepass_field defaults to Password.
[cloud]
rclone_config_keepass_entry = snowbridge/example-rclone-config
rclone_config_keepass_field = Password
