services:
  filebrowser:
    image: "${FILEBROWSER_IMAGE:-docker.io/filebrowser/filebrowser:latest}"
    container_name: snowbridge-filebrowser
    restart: unless-stopped
    user: "${SNOWBRIDGE_UID}:${SNOWBRIDGE_GID}"
    security_opt:
      - label=disable
    environment:
      FB_ADDRESS: 0.0.0.0
      FB_PORT: "8080"
      # Local-model folder icons (snowbridge fork only). The model is the
      # host's crew-chief Ollama, reached through setup_crew_chief_relay.sh.
      FB_AI_FOLDER_ICONS: "${FILEBROWSER_AI_FOLDER_ICONS:-false}"
      FB_AI_FOLDER_ICONS_MODEL: "${FILEBROWSER_AI_FOLDER_ICONS_MODEL:-qwen3:14b}"
      FB_AI_FOLDER_ICONS_PREFETCH_USER: "${FILEBROWSER_AI_FOLDER_ICONS_PREFETCH_USER:-}"
      FB_AI_FOLDER_ICONS_URL: unix:///config/crew-chief.sock
      FB_AI_FOLDER_ICONS_CACHE: /database/folder-icons.json
    ports:
      - "127.0.0.1:${FILEBROWSER_HTTP_PORT}:8080"
    volumes:
      - "${SNOWBRIDGE_SHARE_ROOT}:/srv:Z,rbind,rslave"
      - "${FILEBROWSER_DB_DIR}:/database:Z"
      - "${FILEBROWSER_CONFIG_DIR}:/config:Z"

  caddy:
    image: docker.io/library/caddy:2
    container_name: snowbridge-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_BIND}:80:80"
      - "${CADDY_HTTPS_BIND}:443:443"
    volumes:
      - "${CADDYFILE_PATH}:/etc/caddy/Caddyfile:ro,Z"
      - "${CADDY_DATA_DIR}:/data:Z"
      - "${CADDY_CONFIG_DIR}:/config:Z"
