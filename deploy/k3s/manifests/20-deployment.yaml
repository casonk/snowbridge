# The volume lines are generated by render_volumes.py from the machine's share layout and replace the two markers.
# @@UID@@, @@GID@@ and @@SELINUX_LEVEL@@ are read from the real files at apply time and never committed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snowbridge-files-web
  namespace: snowbridge-files
spec:
  replicas: 1
  strategy: {type: Recreate}          # one writer on the database
  selector:
    matchLabels: {app: snowbridge-files-web}
  template:
    metadata:
      labels: {app: snowbridge-files-web}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: @@UID@@
        runAsGroup: @@GID@@
        seccompProfile: {type: RuntimeDefault}
        # The host files carry a private SELinux category pair; the pod uses the same one rather than relabelling
        # every source folder. No fsGroup: on a local volume Kubernetes would recursively re-group the real files.
        seLinuxOptions: {level: "@@SELINUX_LEVEL@@"}
      containers:
        - name: web
          image: localhost:5000/snowbridge-files:k3s
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: FB_ADDRESS, value: "0.0.0.0"}
            - {name: FB_PORT, value: "8080"}
            - {name: FB_AI_FOLDER_ICONS_URL, value: "unix:///config/crew-chief.sock"}
            - {name: FB_AI_FOLDER_ICONS_CACHE, value: "/database/folder-icons.json"}
          envFrom:
            - configMapRef: {name: snowbridge-files-env, optional: true}   # icon switches from config/deploy.local.env
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
# @@VOLUME_MOUNTS@@
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
# @@VOLUMES@@
---
apiVersion: v1
kind: Service
metadata:
  name: snowbridge-files-web
  namespace: snowbridge-files
spec:
  type: ClusterIP
  clusterIP: 10.43.0.64   # fixed: the host-side forwarder names it
  selector: {app: snowbridge-files-web}
  ports: [{name: http, port: 8080, targetPort: http}]
